name: Synchronize develop and main branches to forked repo

on:
  push:
    branches:
      - develop
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Add remote-url
        run: |
          git remote add forked-repo https://minyoung1101:${{ secrets.GH_PAT }}@github.com/minyoung1101/coworkers.git
          git config user.name "minyoung1101"
          git config user.email ${{ secrets.GH_EMAIL }}

      - name: Push changes to forked-repo
        run: |
          git push -f forked-repo ${{ github.ref_name }}

      - name: Clean up
        run: git remote remove forked-repo
